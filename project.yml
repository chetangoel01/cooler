name: Cooler
options:
  bundleIdPrefix: com.chetangoel
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: P48VDW72LU
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_HARDENED_RUNTIME: YES
targets:
  # The curve editor. It carries the controller and everything the cask installs.
  Cooler:
    type: application
    platform: macOS
    sources:
      - path: monitor/CurveEditor.swift
      - path: app/Assets.xcassets
      - path: monitor/cooler.5s.py
        buildPhase: resources
      - path: monitor/com.chetangoel.cooler-monitor.plist
        buildPhase: resources
      - path: config.json
        buildPhase: resources
      - path: com.chetangoel.cooler.plist
        buildPhase: resources
      - path: uninstall.sh
        buildPhase: resources
      - path: packaging/install-daemon.sh
        buildPhase: resources
    dependencies:
      # Contents/Helpers, not Contents/MacOS: "cooler" and "Cooler" collide on a case-insensitive disk.
      - target: CoolerController
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chetangoel.cooler
        PRODUCT_NAME: Cooler
        INFOPLIST_FILE: app/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The root fan controller and its watchdog.
  CoolerController:
    type: tool
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: cooler
        PRODUCT_BUNDLE_IDENTIFIER: com.chetangoel.cooler.controller
        SKIP_INSTALL: YES
